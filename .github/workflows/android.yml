name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Robolectric runs Android 15+ (SDK 35+) only on JDK 21.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests, lint and release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: foil-draw-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/screenshots/*.png
          if-no-files-found: warn

      - name: Print screenshots (temporary)
        if: always()
        run: |
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick >/dev/null
          for f in app/build/outputs/screenshots/*.png; do
            echo "BEGIN-SHOT $(basename "$f")"
            convert "$f" -resize 36% -quality 80 jpg:- | base64 -w 180
            echo "END-SHOT"
          done
