name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Write access is only used to publish a release from a v* tag.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Robolectric runs Android 15+ (SDK 35+) only on JDK 21.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests, lint and release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: foil-draw-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/screenshots/*.png
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || { echo "::error::Tag $tag does not match versionName in app/build.gradle.kts"; exit 1; }
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > notes.md
          apk="foil-draw-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" --title "Протяжка фольги $version" --notes-file notes.md
