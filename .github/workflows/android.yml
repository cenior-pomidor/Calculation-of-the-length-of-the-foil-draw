name: Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release for the versionName in app/build.gradle.kts
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Write access is only used to publish a release.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Robolectric runs Android 15+ (SDK 35+) only on JDK 21.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests, lint and release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: foil-draw-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/screenshots/*.png
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          # Release notes: this version's section of CHANGELOG.md.
          awk -v heading="## $version" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          printf '\nУстановка: скачайте foil-draw-%s.apk и откройте его на телефоне (Android 8.0 и новее).\n' "$version" >> notes.md
          apk="foil-draw-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Протяжка фольги $version" --notes-file notes.md
